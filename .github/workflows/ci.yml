name: CI

# Runs on every push/PR targeting master — type-checks the app and runs its own pure-logic unit
# tests (vitest; no React Native renderer involved, so no simulator/emulator needed). The chess
# engine's Fog of War-specific coverage (en passant, performance, visibility ground truth,
# redaction history) lives in the backend repo instead, since those scripts also test the
# server's own twin implementation side by side — see that repo's ci.yml.
# Pushes to ANY branch run CI too (not just master): with branch protection requiring the `test`
# check on master, a commit can only reach master once that exact commit already has a passing
# check — so it has to be validated on a branch first.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # scripts/cloud-setup.sh builds a cloud session's VM (TESTING.md, "Cloud sessions"); a syntax error would only show when the next session starts.
      - name: Syntax-check the cloud setup script
        run: bash -n scripts/cloud-setup.sh

  # The Android device matrix, quick profile (TESTING.md "Android device matrix", CHECKLIST.md: every new or changed screen must pass it): every screen in a real Chrome at the
  # extremes of window size, text scale, font, display zoom, theme and system-bar insets, checked for clipped text, sideways scroll, cut-off or overlapping controls, touch targets
  # under 44 dp and content under the system bars. Its own job so a failure names itself; the full 720-combination run is the nightly (android-matrix-nightly.yml).
  device-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # playwright-core drives the runner's own Chrome; it is not an app dependency (the cloud sessions get it from the sibling backend checkout).
      - name: Install the browser driver
        run: npm install --no-save playwright-core@1.64.1

      - name: The matrix's own checks catch what they claim to
        run: node scripts/browser/android-matrix.mjs --self-test
        env:
          E2E_BROWSER_PATH: /usr/bin/google-chrome

      - name: Device matrix (quick profile)
        run: node scripts/browser/android-matrix.mjs --profile quick --sheets --out matrix-out
        env:
          E2E_BROWSER_PATH: /usr/bin/google-chrome

      - name: Keep the contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-matrix-sheets
          path: matrix-out
          if-no-files-found: ignore

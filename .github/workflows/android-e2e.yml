name: android-e2e

# THE ANDROID END-TO-END RUN (command #29, TESTING.md section 45). Every Android-only bug of the last weeks (clipped text, touches one rank low, endless spinners, pockets over the board, piece
# colours) passed every check because every check ran in Chromium. This job builds the real app for Android, boots a real emulator (KVM, API 34) and drives it with real touches, on two
# phones (360 x 640 dp at font scale 1.3, and a large phone at 1.0): every main screen, the on-device text-fit probe, the Piece gallery pixels, taps on the 2-player board and on both Bughouse
# boards, an online Bughouse game against the run's own backend, and "Can't reach the server" with the backend stopped. It is meant to be a REQUIRED status check (the job name below is the
# check's name): the steps are in TESTING.md section 45.
#
# A docs-only change skips the heavy steps INSIDE this one job (the job still reports "success", so a required check never hangs on "expected" the way a path-filtered workflow does).
# No secret is used anywhere: the APK is built with `expo prebuild` + Gradle (no EAS), the database is a throw-away service container, the backend is the public chess-app-backend checkout.
on:
  push:
    branches: [master, paired/bughouse, 'proof/**']
  pull_request:
    branches: [master, paired/bughouse]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 'chess-app-backend ref to test against (default: the same branch name, else main)'
        required: false
        default: ''
      all_screens:
        description: 'Run EVERY screen of the matrix lists, not only the core ones (a long run)'
        required: false
        type: boolean
        default: false

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: android-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OUT: ${{ github.workspace }}/android-e2e-out
      EXPO_NO_TELEMETRY: '1'
      ANDROID_E2E_ALL: ${{ github.event.inputs.all_screens == 'true' && '1' || '' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is there anything but documentation in this change?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          code="$(bash scripts/android/changed-code.sh "$base" "${{ github.sha }}")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Install the app's dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci --no-audit --no-fund

      - name: Check out the backend
        if: steps.changes.outputs.code == 'true'
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ref="${{ github.event.inputs.backend_ref }}"
          if [ -z "$ref" ]; then
            case "$branch" in proof/*) ref=paired/bughouse ;; *) ref="$branch" ;; esac
          fi
          if ! git ls-remote --exit-code --heads https://github.com/EMChess007/chess-app-backend.git "$ref" >/dev/null 2>&1; then ref=main; fi
          echo "backend ref: $ref"
          git clone --depth 1 --branch "$ref" https://github.com/EMChess007/chess-app-backend.git backend
          git -C backend log -1 --oneline
          (cd backend && npm ci --no-audit --no-fund)

      # --- the APK: only rebuilt when the NATIVE side changes (the JavaScript comes from Metro at run time) -----------------------------------------------------------------
      - name: Restore the APK
        if: steps.changes.outputs.code == 'true'
        id: apk
        uses: actions/cache/restore@v4
        with:
          path: apk-cache
          key: apk-v1-${{ hashFiles('package-lock.json', 'app.json', 'app.config.js', 'assets/icon.png', 'assets/android-icon-*.png', 'scripts/android/build-apk.sh') }}

      # (restore + explicit save steps, not the combined action: the combined one saves only when the WHOLE job is green, and a red run - the case where a rerun matters most - would throw away
      # a 10 minute build every time)
      - name: Restore Gradle
        if: steps.changes.outputs.code == 'true' && steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-v1-

      - name: Build the debug APK (expo prebuild + Gradle, x86_64)
        if: steps.changes.outputs.code == 'true' && steps.apk.outputs.cache-hit != 'true'
        run: bash scripts/android/build-apk.sh apk-cache

      - name: Save the APK
        if: steps.changes.outputs.code == 'true' && steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apk-cache
          key: ${{ steps.apk.outputs.cache-primary-key }}

      - name: Save Gradle
        if: steps.changes.outputs.code == 'true' && steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('package-lock.json') }}

      # --- Metro (development mode, pointed at the run's backend) and the emulator ---------------------------------------------------------------------------------------------
      - name: Start Metro
        if: steps.changes.outputs.code == 'true'
        run: bash scripts/android/metro.sh start

      - name: Enable KVM
        if: steps.changes.outputs.code == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the emulator image
        if: steps.changes.outputs.code == 'true'
        id: avd
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v1-api34-x86_64-pixel_6

      - name: Create the emulator and its snapshot (first run only)
        if: steps.changes.outputs.code == 'true' && steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the emulator snapshot for caching."

      - name: Save the emulator image
        if: steps.changes.outputs.code == 'true' && steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.cache-primary-key }}

      - name: Android end-to-end run
        if: steps.changes.outputs.code == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android/run-on-emulator.sh apk-cache/app-debug.apk android-e2e-out

      - name: Keep the screenshots, trees and logs
        if: always() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: |
            android-e2e-out
            ${{ runner.temp }}/android-e2e-state/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always() && steps.changes.outputs.code == 'true'
        run: node scripts/android/summary.mjs android-e2e-out >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Metro
        if: always() && steps.changes.outputs.code == 'true'
        run: bash scripts/android/metro.sh stop
